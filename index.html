<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tangkap Makanan Sehat</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0;
            background: #2d3436;
            font-family: sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100dvh; overflow: hidden;
        }
        #game-box {
            width: 100%; max-width: 450px; height: 100%;
            background: #dfe6e9; position: relative; overflow: hidden;
            display: flex; flex-direction: column;
        }
        #top-bar {
            background: #00b894; color: white; padding: 14px 20px;
            display: flex; justify-content: space-between;
            font-weight: bold; font-size: 18px; z-index: 2;
        }
        #play-area {
            flex: 1; position: relative;
            background: linear-gradient(to bottom, #81ecec, #74b9ff);
            overflow: hidden; touch-action: none;
        }
        #player {
            position: absolute; bottom: 25px; left: 150px;
            width: 75px; height: 75px; border-radius: 50%;
            border: 4px solid #fff; background-color: #ffeaa7;
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center;
            font-size: 40px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 5;
        }
        .food {
            position: absolute; width: 48px; height: 48px;
            font-size: 36px; display: flex; justify-content: center; align-items: center;
            z-index: 4;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.96);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 25px; text-align: center; z-index: 99;
        }
        .btn-main {
            background: #00b894; color: white; border: none;
            padding: 15px 35px; font-size: 18px; font-weight: bold;
            border-radius: 30px; cursor: pointer; margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0,184,148,0.4);
        }
        .btn-main:active { transform: scale(0.95); }
        .pop {
            position: absolute; font-weight: bold; font-size: 22px;
            pointer-events: none; z-index: 10;
            animation: naik 0.7s ease-out forwards;
        }
        @keyframes naik {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-45px); }
        }
    </style>
</head>
<body>

<div id="game-box">
    <div id="top-bar">
        <div>⭐ Skor: <span id="skor">0</span></div>
        <div>❤️ Nyawa: <span id="nyawa">3</span></div>
    </div>

    <div id="play-area">
        <div id="player">😋</div>
    </div>

    <!-- MENU AWAL -->
    <div id="menu-awal" class="overlay">
        <h1 style="margin:0 0 10px; color:#2d3436;">🍎 Tangkap Sehat 🥦</h1>
        <p style="color:#636e72; font-size:14px;">Geser karakter untuk tangkap makanan sehat (+poin) & hindari junk food (-nyawa).</p>
        
        <div style="margin: 15px 0; background:#f1f2f6; padding:12px; border-radius:12px; width:100%;">
            <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:6px;">📸 Pilih Foto Karakter (Opsional):</label>
            <input type="file" id="foto-input" accept="image/*" onchange="gantiFoto(event)" style="width:100%;">
        </div>

        <button type="button" class="btn-main" onclick="mulaiGame()">▶ MULAI GAME</button>
    </div>

    <!-- MENU KALAH -->
    <div id="menu-kalah" class="overlay" style="display:none;">
        <h1 style="color:#d63031; margin:0 0 10px;">Game Over! 🎮</h1>
        <p style="font-size:18px; margin:5px 0;">Skor Kamu: <b id="skor-akhir">0</b></p>
        <p style="font-size:15px; color:#636e72; margin:5px 0 15px;">Skor Tertinggi: <b id="skor-tertinggi">0</b></p>
        <button type="button" class="btn-main" onclick="mulaiGame()">🔄 MAIN LAGI</button>
    </div>
</div>

<script>
    var skor = 0;
    var nyawa = 3;
    var jalan = false;
    var posisiX = 150;
    var daftarMakanan = [];
    var loopGame, loopMuncul;

    var area = document.getElementById('play-area');
    var pemain = document.getElementById('player');

    var listItem = [
        { ikon: '🍎', sehat: true, poin: 10 },
        { ikon: '🥦', sehat: true, poin: 15 },
        { ikon: '🥕', sehat: true, poin: 10 },
        { ikon: '🍌', sehat: true, poin: 10 },
        { ikon: '🥑', sehat: true, poin: 20 },
        { ikon: '🍔', sehat: false, poin: -10 },
        { ikon: '🍕', sehat: false, poin: -10 },
        { ikon: '🍩', sehat: false, poin: -15 },
        { ikon: '🥤', sehat: false, poin: -15 }
    ];

    function gantiFoto(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            pemain.style.backgroundImage = "url('" + ev.target.result + "')";
            pemain.textContent = "";
        };
        reader.readAsDataURL(file);
    }

    function geserPemain(clientX) {
        if (!jalan) return;
        var rect = area.getBoundingClientRect();
        var x = clientX - rect.left - 37.5;
        var batasKanan = area.clientWidth - 75;
        if (x < 0) x = 0;
        if (x > batasKanan) x = batasKanan;
        posisiX = x;
        pemain.style.left = posisiX + 'px';
    }

    area.addEventListener('mousemove', function(e) { geserPemain(e.clientX); });
    area.addEventListener('mousedown', function(e) { geserPemain(e.clientX); });
    area.addEventListener('touchmove', function(e) {
        geserPemain(e.touches[0].clientX);
        e.preventDefault();
    }, { passive: false });
    area.addEventListener('touchstart', function(e) {
        geserPemain(e.touches[0].clientX);
    }, { passive: true });

    function mulaiGame() {
        document.getElementById('menu-awal').style.display = 'none';
        document.getElementById('menu-kalah').style.display = 'none';

        skor = 0;
        nyawa = 3;
        jalan = true;
        document.getElementById('skor').textContent = skor;
        document.getElementById('nyawa').textContent = nyawa;

        posisiX = (area.clientWidth / 2) - 37.5;
        pemain.style.left = posisiX + 'px';

        var sisa = document.querySelectorAll('.food');
        for (var i = 0; i < sisa.length; i++) { sisa[i].remove(); }
        daftarMakanan = [];

        clearInterval(loopGame);
        clearInterval(loopMuncul);

        loopGame = setInterval(updateFrame, 20);
        loopMuncul = setInterval(buatMakanan, 750);
    }

    function buatMakanan() {
        if (!jalan) return;
        var data = listItem[Math.floor(Math.random() * listItem.length)];
        var el = document.createElement('div');
        el.className = 'food';
        el.textContent = data.ikon;

        var startX = Math.random() * (area.clientWidth - 48);
        el.style.left = startX + 'px';
        el.style.top = '-50px';
        area.appendChild(el);

        daftarMakanan.push({
            el: el, x: startX, y: -50,
            kecepatan: 3 + Math.random() * 2.5,
            data: data
        });
    }

    function updateFrame() {
        var batasPemainY = area.clientHeight - 100;

        for (var i = daftarMakanan.length - 1; i >= 0; i--) {
            var m = daftarMakanan[i];
            m.y += m.kecepatan;
            m.el.style.top = m.y + 'px';

            if (m.y + 45 >= batasPemainY && m.y <= batasPemainY + 75 &&
                m.x + 45 >= posisiX && m.x <= posisiX + 75) {
                kenaMakanan(m);
                m.el.remove();
                daftarMakanan.splice(i, 1);
                continue;
            }

            if (m.y > area.clientHeight) {
                m.el.remove();
                daftarMakanan.splice(i, 1);
            }
        }
    }

    function kenaMakanan(m) {
        var teks = document.createElement('div');
        teks.className = 'pop';
        teks.style.left = m.x + 'px';
        teks.style.top = (area.clientHeight - 90) + 'px';

        if (m.data.sehat) {
            skor += m.data.poin;
            teks.textContent = '+' + m.data.poin;
            teks.style.color = '#00b894';
        } else {
            skor = Math.max(0, skor + m.data.poin);
            nyawa -= 1;
            teks.textContent = m.data.poin + ' ❤️-1';
            teks.style.color = '#d63031';
        }

        document.getElementById('skor').textContent = skor;
        document.getElementById('nyawa').textContent = nyawa;
        area.appendChild(teks);
        setTimeout(function() { teks.remove(); }, 700);

        if (nyawa <= 0) {
            selesaiGame();
        }
    }

    function selesaiGame() {
        jalan = false;
        clearInterval(loopGame);
        clearInterval(loopMuncul);

        var rekor = localStorage.getItem('rekorSehat') || 0;
        if (skor > rekor) {
            rekor = skor;
            localStorage.setItem('rekorSehat', rekor);
        }
        document.getElementById('skor-akhir').textContent = skor;
        document.getElementById('skor-tertinggi').textContent = rekor;
        document.getElementById('menu-kalah').style.display = 'flex';
    }
</script>
</body>
</html>
