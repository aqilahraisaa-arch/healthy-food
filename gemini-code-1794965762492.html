<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tangkap Makanan Sehat</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 800px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        /* Layar Menu / UI */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            color: #2d3436;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #636e72;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,184,148,0.4);
            transition: 0.2s;
            margin: 5px;
        }
        .btn:hover {
            background-color: #00a885;
            transform: translateY(-2px);
        }
        .file-input-container {
            margin: 15px 0;
        }
        /* Area Game */
        #game-canvas-area {
            flex: 1;
            position: relative;
            background: url('https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=600&q=80') center/cover;
            overflow: hidden;
            cursor: pointer;
        }
        /* Header Info Game */
        #game-header {
            background: #2d3436;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        /* Karakter Pemain */
        #player {
            position: absolute;
            bottom: 20px;
            left: calc(50% - 40px);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background-color: #dfe6e9;
            background-size: cover;
            background-position: center;
            z-index: 5;
        }
        /* Item Makanan */
        .item {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            z-index: 4;
            animation: rotateItem 3s infinite linear;
        }
        @keyframes rotateItem {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Efek pop angka */
        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 20px;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 6;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HEADER STATS -->
        <div id="game-header">
            <div class="stat-item">⭐ Skor: <span id="score">0</span></div>
            <div class="stat-item">❤️ Nyawa: <span id="lives">3</span></div>
        </div>

        <!-- AREA PERMAINAN -->
        <div id="game-canvas-area">
            <div id="player"></div>
        </div>

        <!-- LAYAR UTAMA (MENU) -->
        <div id="start-screen" class="screen">
            <h1>🍎 Tangkap Makanan Sehat 🥦</h1>
            <p>Tangkap makanan sehat untuk menambah skor, dan hindari makanan tidak sehat agar nyawa tidak berkurang!</p>
            
            <div class="file-input-container">
                <label style="font-size: 14px; color: #2d3436; display: block; margin-bottom: 5px;">Upload Foto Wajah Kamu:</label>
                <input type="file" id="photo-upload" accept="image/*">
            </div>

            <button class="btn" id="start-btn">Mulai Game</button>
        </div>

        <!-- LAYAR GAME OVER -->
        <div id="game-over-screen" class="screen hidden">
            <h1>Game Over! 🎮</h1>
            <p>Skor Akhir Kamu: <span id="final-score">0</span></p>
            <p>Skor Tertinggi: <span id="high-score">0</span></p>
            <button class="btn" id="restart-btn">Main Lagi</button>
        </div>
    </div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const finalScoreEl = document.getElementById('final-score');
        const highScoreEl = document.getElementById('high-score');
        const canvasArea = document.getElementById('game-canvas-area');
        const player = document.getElementById('player');
        const photoUpload = document.getElementById('photo-upload');

        let score = 0;
        let lives = 3;
        let highScore = localStorage.getItem('highScore') || 0;
        let isPlaying = false;
        let playerX = 185; // Posisi awal player (tengah)
        let gameInterval, itemSpawner;
        let items = [];

        // Daftar Makanan Sehat & Tidak Sehat
        const foodTypes = [
            { emoji: '🍎', healthy: true, points: 10 },
            { emoji: '🥦', healthy: true, points: 15 },
            { emoji: '🥕', healthy: true, points: 10 },
            { emoji: '🍌', healthy: true, points: 10 },
            { emoji: '🥑', healthy: true, points: 20 },
            { emoji: '🍔', healthy: false, points: -10, damage: 1 },
            { emoji: '🍕', healthy: false, points: -10, damage: 1 },
            { emoji: '🍩', healthy: false, points: -15, damage: 1 },
            { emoji: '🥤', healthy: false, points: -15, damage: 1 }
        ];

        // Upload Foto Wajah
        photoUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    player.style.backgroundImage = `url('${event.target.result}')`;
                }
                reader.readAsDataURL(file);
            }
        });

        // Kontrol Mouse / Touch Geser Karakter
        function updatePlayerPosition(clientX) {
            const rect = canvasArea.getBoundingClientRect();
            let x = clientX - rect.left - 40; // Center offset
            const maxX = canvasArea.clientWidth - 80;
            
            if (x < 0) x = 0;
            if (x > maxX) x = maxX;
            
            playerX = x;
            player.style.left = playerX + 'px';
        }

        canvasArea.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            updatePlayerPosition(e.clientX);
        });

        canvasArea.addEventListener('touchmove', (e) => {
            if (!isPlaying) return;
            updatePlayerPosition(e.touches[0].clientX);
            e.preventDefault();
        }, { passive: false });

        // Mulai Game
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            score = 0;
            lives = 3;
            scoreEl.textContent = score;
            livesEl.textContent = lives;
            isPlaying = true;

            // Hapus sisa item lama
            document.querySelectorAll('.item').forEach(el => el.remove());
            items = [];

            // Looping Utama Game
            if (gameInterval) clearInterval(gameInterval);
            if (itemSpawner) clearInterval(itemSpawner);

            gameInterval = setInterval(updateGame, 20);
            itemSpawner = setInterval(spawnItem, 800);
        }

        // Munculkan Makanan dari Atas
        function spawnItem() {
            if (!isPlaying) return;

            const foodData = foodTypes[Math.floor(Math.random() * foodTypes.length)];
            const itemEl = document.createElement('div');
            itemEl.classList.add('item');
            itemEl.textContent = foodData.emoji;

            const maxX = canvasArea.clientWidth - 50;
            const startX = Math.random() * maxX;

            const itemObj = {
                element: itemEl,
                x: startX,
                y: -50,
                speed: 2 + Math.random() * 3,
                data: foodData
            };

            itemEl
